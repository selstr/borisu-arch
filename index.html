<!doctype html>

<head>
<meta charset="utf-8" />

<title>정토사회문화회관 건축분과 발표</title>
<style>
  :root{ --bg:#14170f; --muted:#cfd3c4; --navh:46px; }
  *{box-sizing:border-box;}
  html, body{ height:100%; margin:0; overflow:hidden; background:var(--bg); }
  body{
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;
  }
  .nav{
    position:fixed; top:0; left:0; right:0; height:var(--navh); z-index:10;
    background:rgba(20,23,15,0.92); backdrop-filter:blur(6px);
    padding:0 16px; display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .nav .title{font-size:0.92rem; color:var(--muted);}
  .nav .count{font-size:0.8rem; color:#9aa38c; white-space:nowrap;}

  .scroller{
    height:100%; overflow-y:auto; overflow-x:hidden;
    scroll-snap-type:y mandatory; scroll-behavior:smooth;
  }
  .page{
    height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    scroll-snap-align:start; scroll-snap-stop:always;
    padding: calc(var(--navh) + 14px) 16px 14px;
    background:var(--bg);
    cursor:pointer;
  }
  .slide{
    position:relative;
    width:min(94vw, calc((100vh - var(--navh) - 28px) * 1.77778));
    aspect-ratio: 1600 / 900;
    border-radius:10px; overflow:hidden;
    box-shadow:0 2px 14px rgba(0,0,0,0.45);
    background:#000;
  }
  .slide img{display:block; width:100%; height:100%; object-fit:cover;}
  .slide video{
    position:absolute; display:block; border-radius:4px; background:#000;
    box-shadow:0 0 0 2px rgba(255,255,255,0.08);
    cursor:default;
  }
  .num{
    position:absolute; left:8px; bottom:8px; background:rgba(0,0,0,0.55);
    color:#fff; font-size:0.72rem; padding:2px 8px; border-radius:999px;
  }
  .hint{
    position:fixed; right:16px; bottom:14px; z-index:10;
    font-size:0.78rem; color:#9aa38c; background:rgba(20,23,15,0.8);
    padding:4px 10px; border-radius:999px; pointer-events:none;
    transition:opacity .4s;
  }
</style>
</head>

<script>
(function(){
  const scroller = document.getElementById('scroller');
  const pages = Array.from(document.querySelectorAll('.page'));
  const hint = document.getElementById('hint');

  function currentIndex(){
    let best = 0, bestDist = Infinity;
    pages.forEach((p, i) => {
      const d = Math.abs(p.getBoundingClientRect().top);
      if (d < bestDist) { bestDist = d; best = i; }
    });
    return best;
  }

  function goTo(i){
    if (i < 0 || i >= pages.length) return;
    pages[i].scrollIntoView({behavior:'smooth', block:'start'});
  }

  document.querySelectorAll('.page').forEach(page => {
    page.addEventListener('click', (e) => {
      if (e.target.closest('video')) return; // 영상 조작은 그대로 둠
      const i = currentIndex();
      goTo(i + 1 >= pages.length ? i : i + 1);
    });
  });

  window.addEventListener('keydown', (e) => {
    const i = currentIndex();
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { goTo(i+1); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { goTo(i-1); e.preventDefault(); }
  });

  let hid = false;
  scroller.addEventListener('scroll', () => { if(!hid){ hint.style.opacity = '0'; hid = true; } }, {once:true});
  setTimeout(() => { hint.style.opacity = '0'; }, 4000);
})();
</script>
